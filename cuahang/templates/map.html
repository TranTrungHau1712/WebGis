<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Chuỗi Cửa Hàng</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Thiết lập chiều cao full màn hình */
        body, html { height: 100%; margin: 0; overflow: hidden; }
        
        /* Cột danh sách bên trái có thanh cuộn */
        #sidebar {
            height: calc(100vh - 56px); /* Trừ đi chiều cao Navbar */
            overflow-y: auto;
            background-color: #f8f9fa;
            border-right: 1px solid #ddd;
        }

        /* Bản đồ bên phải */
        #map { height: calc(100vh - 56px); width: 100%; }

        /* Hiệu ứng khi di chuột vào danh sách */
        .shop-item { cursor: pointer; transition: 0.2s; }
        .shop-item:hover { background-color: #e9ecef; }
        
        /* Màu chủ đạo */
        .bg-custom { background-color: #0d6efd; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-custom px-3">
        <a class="navbar-brand" href="#">
            🏪 <b>QUẢN LÝ CỬA HÀNG</b>
        </a>
        <span class="text-white">Admin: {{ user.username }}</span>
    </nav>

    <div class="container-fluid">
        <div class="row">
            
            <div class="col-md-3 p-0" id="sidebar">
                <div class="list-group list-group-flush" id="shop-list">
                    <div class="p-3 text-center text-muted">Đang tải dữ liệu...</div>
                </div>
            </div>

            <div class="col-md-9 p-0">
                <div id="map"></div>
            </div>

        </div>
    </div>

    <script>
        // 1. Khởi tạo bản đồ
        var map = L.map('map').setView([10.776, 106.700], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. Lấy dữ liệu
        var storeData = JSON.parse("{{ data_json|escapejs }}");
        var listContainer = document.getElementById('shop-list');
        listContainer.innerHTML = ''; 

        // --- BIẾN QUAN TRỌNG: Lưu trữ vòng tròn đang hiển thị ---
        var currentCircle = null; 

        // Hàm hỗ trợ: Vẽ vòng tròn mới và xóa vòng tròn cũ
        function veVongTron(lat, lng, banKinh) {
            // Nếu đang có vòng tròn nào thì xóa đi
            if (currentCircle) {
                map.removeLayer(currentCircle);
            }
            
            // Vẽ vòng tròn mới
            if (banKinh) {
                currentCircle = L.circle([lat, lng], {
                    color: 'red',
                    fillColor: '#f03',
                    fillOpacity: 0.1,
                    radius: banKinh * 1000 // Đổi km sang mét
                }).addTo(map);
            }
        }

        // 3. Duyệt qua dữ liệu
        L.geoJSON(storeData, {
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng);
            },
            onEachFeature: function (feature, layer) {
                var props = feature.properties;
                var lat = feature.geometry.coordinates[1];
                var lng = feature.geometry.coordinates[0];

                // A. TẠO POPUP
                var content = `<b>${props.ten_quan}</b><br>${props.dia_chi}<br><i>Ship: ${props.ban_kinh}km</i>`;
                layer.bindPopup(content);

                // --- B. SỰ KIỆN CLICK VÀO MARKER TRÊN BẢN ĐỒ ---
                // Khi click vào điểm đỏ -> Vẽ vòng tròn
                layer.on('click', function() {
                    veVongTron(lat, lng, props.ban_kinh);
                });

                // C. TẠO MỤC TRONG DANH SÁCH
                var listItem = document.createElement('a');
                listItem.className = 'list-group-item list-group-item-action shop-item p-3';
                listItem.innerHTML = `
                    <h5 class="mb-1">${props.ten_quan}</h5>
                    <small class="text-muted">📍 Bán kính ship: ${props.ban_kinh} km</small>
                `;

                // --- D. SỰ KIỆN CLICK VÀO DANH SÁCH ---
                listItem.onclick = function() {
                    // 1. Bay đến
                    map.flyTo([lat, lng], 14, { duration: 1.5 });
                    
                    // 2. Sau khi bay xong thì mở Popup và VẼ VÒNG TRÒN
                    setTimeout(() => {
                        layer.openPopup();
                        veVongTron(lat, lng, props.ban_kinh); // Gọi hàm vẽ
                    }, 1500);
                };

                listContainer.appendChild(listItem);
            }
        }).addTo(map);
    </script>
</body>
</html>
